name: "Draft Release"

on:
  workflow_dispatch:
  push:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  draft:
    name: "Draft Release"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: write

    steps:
      - name: "Checkout"
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: "Get Previous Tag"
        id: prev-tag
        run: |
          LATEST_TAG=$(gh release view --json tagName --jq .tagName)
          echo "LATEST_TAG: ${LATEST_TAG}"
          TAG_TIME=$(git log -1 --format=%ct "${LATEST_TAG}")
          echo "TAG_TIME: ${TAG_TIME}"
          PREV_SHA=$(git rev-list -1 --before="${TAG_TIME}" --first-parent origin/master)
          echo "PREV_SHA: ${PREV_SHA}"
          echo "sha=${PREV_SHA}" >> "${GITHUB_OUTPUT}"

      - name: "Draft Release Action"
        id: draft
        uses: cssnr/draft-release-action@updates # TODO: Testing Updates
        with:
          semver: patch
          prerelease: false
          prefix: v
          previous_tag_name: ${{ steps.prev-tag.outputs.sha }}

      - name: "Process Release Draft URL"
        run: |
          echo "url: ${{ steps.draft.outputs.url }}"
