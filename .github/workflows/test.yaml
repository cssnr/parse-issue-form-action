name: "Test"

on:
  workflow_dispatch:
  schedule:
    - cron: "18 18 * * 1,3,5"
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: "Test"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Test Local Action"
        id: test
        uses: ./
        with:
          body: "### Test Head\n\nTest value."

      - name: "Validate Outputs"
        run: |
          echo '${{ steps.test.outputs.test_head }}'
          if [ '${{ steps.test.outputs.test_head }}' != 'Test value.' ];then
            echo "Invalid Output"
            exit 1
          fi

      - name: "Schedule Failure Notification"
        if: ${{ always() && failure() && github.event_name == 'schedule' }}
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
