name: "Test"

on:
  workflow_dispatch:
  #schedule:
  #  - cron: "18 18 * * 1,3,5"
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: "Test"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Debug event.json"
        if: ${{ !github.event.act }}
        continue-on-error: true
        run: cat "${GITHUB_EVENT_PATH}"
      - name: "Debug CTX github"
        if: ${{ !github.event.act }}
        continue-on-error: true
        env:
          GITHUB_CTX: ${{ toJSON(github) }}
        run: echo "$GITHUB_CTX"
      - name: "Debug Environment"
        if: ${{ !github.event.act }}
        continue-on-error: true
        run: env

      - name: "Setup Node"
        if: ${{ !github.event.act }}
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: "Install & Build"
        if: ${{ !github.event.act }}
        run: |
          npm ci

      - name: "Debug"
        if: ${{ !github.event.act }}
        continue-on-error: true
        run: |
          ls -lah .

      - name: "Test Local Action"
        id: test
        uses: ./
        with:
          body: "### Test Head\n\nTest value."

      - name: "Verify Outputs"
        run: |
          echo '${{ steps.test.outputs.test_head }}'
          if [ '${{ steps.test.outputs.test_head }}' != 'Test value.' ];then
            echo "Invalid Output"
            exit 1
          fi

      - name: "Schedule Failure Notification"
        if: ${{ failure() && github.event_name == 'schedule' }}
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          description: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
